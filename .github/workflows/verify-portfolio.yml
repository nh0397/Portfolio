name: Verify portfolio

on:
  push:
    branches: ['portfolio-content-video']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Scripts/requirements-sync.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/portfolio/package-lock.json
      - run: pip install -r Scripts/requirements-sync.txt
      - run: python -m unittest discover -s Scripts/tests -v
      - run: npm ci
        working-directory: Frontend/portfolio
      - run: npm run lint
        working-directory: Frontend/portfolio
      - run: npm run build
        working-directory: Frontend/portfolio
