name: Sync portfolio data

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'Scripts/resources/**'

permissions:
  contents: write

concurrency:
  group: portfolio-data-sync
  cancel-in-progress: false

jobs:
  sync:
    # Feature branches never write the production database.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME || 'nh0397' }}
      GITHUB_TOKEN: ${{ github.token }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      EXTRACTION_MODEL: ${{ vars.EXTRACTION_MODEL || 'gemini-2.5-flash' }}
      FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
      MONGO_USERNAME: ${{ secrets.MONGO_USERNAME }}
      MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
      MONGO_HOST: ${{ secrets.MONGO_HOST }}
      MONGO_DB_NAME: ${{ secrets.MONGO_DB_NAME }}
      MONGO_CHUNKS_CL_NAME: ${{ vars.MONGO_CHUNKS_CL_NAME || 'portfolio-chunks' }}
      MONGO_CHUNKS_INDEX_NAME: ${{ vars.MONGO_CHUNKS_INDEX_NAME || 'chunks_vector_index' }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'nomic-ai/nomic-embed-text-v1.5' }}
      EMBEDDING_DIMS: ${{ vars.EMBEDDING_DIMS || '768' }}
      LINKEDIN_REFRESH: ${{ vars.LINKEDIN_REFRESH || 'false' }}
      LINKEDIN_URL: ${{ vars.LINKEDIN_URL || 'https://www.linkedin.com/in/naisarg-h/' }}
      LINKEDIN_EMAIL: ${{ secrets.LINKEDIN_EMAIL }}
      LINKEDIN_PASSWORD: ${{ secrets.LINKEDIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Scripts/requirements-sync.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/portfolio/package-lock.json
      - run: pip install -r Scripts/requirements-sync.txt
      - run: python -m unittest discover -s Scripts/tests -v
      - run: npm ci
        working-directory: Frontend/portfolio
      - name: Validate frontend before updating database
        run: npm run build
        working-directory: Frontend/portfolio
      - name: Refresh MongoDB and generate UI JSON
        run: python Scripts/sync_portfolio.py
      - name: Build with refreshed data
        run: npm run build
        working-directory: Frontend/portfolio
      - name: Save generated frontend data
        id: commit
        shell: bash
        run: |
          git add Frontend/portfolio/src/data/portfolioData.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Refresh portfolio source data"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger Netlify rebuild when configured
        if: steps.commit.outputs.changed == 'true'
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -n "$NETLIFY_BUILD_HOOK" ]; then
            curl --fail --silent --show-error --retry 3 -X POST "$NETLIFY_BUILD_HOOK"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-site
          path: Frontend/portfolio/dist
